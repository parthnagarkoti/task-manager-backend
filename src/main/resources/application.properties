# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────
spring.application.name=task-management-backend

# ─────────────────────────────────────────────
# MySQL DataSource
# Credentials are read from environment variables (set in .env)
# so this file is safe to commit to GitHub.
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/taskmanagement?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────
# create-drop : drops and recreates schema on every restart (good for early development)
# update      : adds new columns but never drops (safer once schema is stable)
# validate    : only validates — use in production
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
