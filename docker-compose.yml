services:

  # ── MySQL 8 Database ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: taskmanagement-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskmanagement
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      # Persist MySQL data across container restarts
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot App ───────────────────────────────────────────────
  app:
    build: .
    container_name: taskmanagement-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Inside the compose network, MySQL is reachable by service name "mysql"
      # on its container-internal port 3306 (the 3307 host mapping above is
      # only relevant when connecting from outside Docker).
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskmanagement?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    ports:
      # Host 8080/8081 are already used by other local services on this
      # machine — mapped to 8082 here; adjust if that's free on yours.
      - "8082:8081"

volumes:
  mysql_data:
