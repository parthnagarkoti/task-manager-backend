  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     DB_USERNAME: ${DB_USERNAME}
  #     DB_PASSWORD: ${DB_PASSWORD}
  #     JWT_SECRET: ${JWT_SECRET}
  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskmanagement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  #   ports:
  #     - "8080:8080"

volumes:
  mysql_data:
