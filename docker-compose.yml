services:

  # ── MySQL 8 Database ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: taskmanagement-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskmanagement
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Persist MySQL data across container restarts
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot App ───────────────────────────────────────────────
  # Uncomment this after Step 7 (Dockerfile is added)
  # app:
  #   build: .
  #   container_name: taskmanagement-app
  #   restart: unless-stopped
